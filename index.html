<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V//NETBLADE Field Guide</title>
<style>
html,body{margin:0;min-height:100%;background:#070a0d;color:#e9f5f5;font:15px/1.5 Segoe UI,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{color:#00f0ff;font-size:32px}.boot small{display:block;margin-top:8px;color:#8ea5aa}.err{color:#ff2a6d}
</style>
</head>
<body>
<div class="boot" id="boot"><div><b>V//NETBLADE</b><small>SYNCING PLAYTHROUGH STATE…</small></div></div>
<script>
(async()=>{
  const base='https://cdn.jsdelivr.net/gh/GlennMitchellAU/cyberpunk-2077-playthrough-guide@2a75054c48548a7ab1c2a9e5865e9e6bb166ce13/index.html';
  try{
    const r=await fetch(base,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    // The historical guide is only the visual/template shell. All mutable playthrough
    // state is rendered by state.js. Cache-bust it on every page load so a newly
    // pushed checkpoint cannot be hidden behind an old browser/CDN copy.
    const stateUrl='state.js?v='+Date.now();
    html=html.replace('</body>','<script src="'+stateUrl+'"><\\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b class="err">SYNC FAILED</b><small>'+String(e)+'</small><small><a style="color:#00f0ff" href="https://github.com/GlennMitchellAU/cyberpunk-2077-playthrough-guide">Open repository</a></small></div>';
  }
})();
</script>
</body>
</html>
